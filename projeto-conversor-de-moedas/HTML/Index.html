<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <title>Conversor de Moedas</title>
</head>

<body>
  <img class="logo" src="../ASSENTS/conversor.webp" alt="logo-convert">
  <main>
    <label>
      Converter <b>de</b>
      <select class="currency-select2">
        <option value="real2">R$ Real Brasileiro</option>
        <option value="dolar2">US$ Dólar Americano</option>
        <option value="euro2"> € Euro</option>

      </select>
    </label>

    <label>
      Converter <b>para</b>
      <select class="currency-select">
        <option value="dolar">US$ Dólar Americano</option>
        <option value="euro"> € Euro</option>
        <option value="real">R$ Real Brasileiro</option>
      </select>
    </label>

    <label>
      Valor
      <input class="input-currency" placeholder="R$ 10.000,00">
    </label>

    <button class="convert-button">Converter</button>

    <section>
      <div class="currency-box">
        <img class= brazil-currency src="../ASSENTS/Brazilian-icon.png" alt="real">
        <p class="currency" id="currency-name2">Real</p>
        <p class="currency-value-to-convert">R$</p>
      </div>

      <img class="arrow" src= "../ASSENTS/Vector.png" alt="arrow">

      <div class="currency-box">
        <img class="currency-img" src="../ASSENTS/EUA-icon.png" alt="dolar">
        <p class="currency" id="currency-name">Dólar</p>
        <p class="currency-value">US$</p>
      </div>

    </section>
    
  </main>
  <script src="../JS/script.js">oijs</script>
</body>

</html>
